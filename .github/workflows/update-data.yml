name: Update earthquake data

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and can lag under
    # load, so the site always shows how old the snapshot actually is.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-quakes.mjs"
      - ".github/workflows/update-data.yml"

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest quakes
        run: node scripts/fetch-quakes.mjs

      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- data/istanbul.json; then
            echo "No new earthquake data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/istanbul.json
          git commit -m "chore(data): refresh Istanbul earthquake snapshot"
          # Another scheduled run may have landed while this one was fetching.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --strategy-option=theirs
            sleep $((attempt * 3))
          done
          exit 1
