name: Refresh data and deploy

# One pipeline on purpose: commits made with GITHUB_TOKEN do not trigger new
# workflow runs (GitHub's anti-recursion rule), so a separate deploy workflow
# listening for pushes would never see the data commits and the published site
# would sit frozen while data/istanbul.json kept moving.

# There is deliberately no `schedule:` here. A `*/10` cron asks for ~4,300 runs
# a month; GitHub drops most high-frequency schedule events, so in practice it
# fired about a tenth of that -- still Actions budget spent on keeping a
# snapshot warm that the page does not need, because once data/istanbul.json is
# more than 10 minutes old the browser queries the API itself (see README,
# "Where the data comes from"). So this workflow runs when the site changes, or
# on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch latest quakes
        run: node scripts/fetch-quakes.mjs

      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- data/istanbul.json; then
            echo "No new earthquake data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/istanbul.json
          git commit -m "chore(data): refresh Istanbul earthquake snapshot"
          # Another run may have landed while this one was fetching.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --strategy-option=theirs
            sleep $((attempt * 3))
          done
          exit 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    # Every trigger here is a push or a manual run, so always publish: a fetch
    # that failed or found nothing new must not stop site changes from shipping.
    if: ${{ !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must already be enabled with Source = GitHub Actions
      # (Settings -> Pages). configure-pages cannot turn it on for us: creating
      # a Pages site needs repo-admin rights, which GITHUB_TOKEN cannot hold.
      - uses: actions/checkout@v4
        with:
          # Pick up the snapshot the update job just pushed, which is newer
          # than the SHA that triggered this run.
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
